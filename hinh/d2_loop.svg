<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1200" height="680" fill="#ffffff"/><rect x="30" y="40" width="330" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="195" y="79.4" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">Tài liệu môn học</text><text x="195" y="100.2" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">(thư viện số, sinh viên tải lên,</text><text x="195" y="121" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">link YouTube, ảnh chụp)</text><rect x="30" y="200" width="330" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/><text x="195" y="249.79999999999998" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">Cổng đào tạo</text><text x="195" y="270.59999999999997" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">(môn học, lịch thi, điểm đã thi)</text><rect x="430" y="40" width="320" height="110" rx="10" fill="#e0e7ff" stroke="#3730a3" stroke-width="2"/><text x="590" y="79.4" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Bản đồ kiến thức</text><text x="590" y="100.2" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">+ chỉ mục RAG</text><text x="590" y="121" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">(khái niệm theo chương)</text><rect x="430" y="200" width="320" height="150" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="590" y="249" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Hồ sơ người học</text><text x="590" y="269.8" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">(Learner Model)</text><text x="590" y="290.6" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">mức thành thạo, lỗi cũ,</text><text x="590" y="311.4" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">sở thích, nhịp học, mục tiêu</text><line x1="360" y1="95" x2="430" y2="95" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="360" y1="255" x2="430" y2="255" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><rect x="830" y="120" width="340" height="150" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="1000" y="169" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Bộ soạn bài học</text><text x="1000" y="189.8" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">(Lesson Composer + LLM)</text><text x="1000" y="210.6" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">chọn khái niệm, lấy đoạn tài liệu,</text><text x="1000" y="231.4" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">soạn theo hồ sơ, kiểm tra bám nguồn</text><line x1="750" y1="95" x2="830" y2="160" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><rect x="697.64" y="66.1" width="184.72" height="16.099999999999998" fill="#ffffff" fill-opacity="0.92"/><text x="790" y="78" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-style="italic">quyết định NỘI DUNG ĐÚNG</text><line x1="750" y1="255" x2="830" y2="215" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><rect x="683.08" y="288.1" width="213.84" height="16.099999999999998" fill="#ffffff" fill-opacity="0.92"/><text x="790" y="300" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-style="italic">quyết định HÌNH DẠNG bài học</text><rect x="830" y="330" width="340" height="110" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="1000" y="369.40000000000003" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Bài học cá nhân</text><text x="1000" y="390.20000000000005" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">sinh tại thời điểm học, cho đúng</text><text x="1000" y="411.00000000000006" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">một sinh viên, một khái niệm</text><line x1="1000" y1="270" x2="1000" y2="330" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><rect x="830" y="490" width="340" height="110" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/><text x="1000" y="539.8000000000001" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">Sinh viên học, làm quiz,</text><text x="1000" y="560.6" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">hỏi trợ giảng, đọc trên extension</text><line x1="1000" y1="440" x2="1000" y2="490" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><rect x="430" y="490" width="320" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="590" y="529.4" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111" font-weight="bold">Tín hiệu học tập</text><text x="590" y="550.1999999999999" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">đúng/sai, thời gian, câu hỏi đặt ra,</text><text x="590" y="571" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#111">lỗi lặp lại, đánh giá bài học</text><line x1="830" y1="545" x2="750" y2="545" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><line x1="590" y1="490" x2="590" y2="350" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)"/><rect x="604.04" y="400.1" width="111.92" height="16.099999999999998" fill="#ffffff" fill-opacity="0.92"/><text x="660" y="412" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#1f2937" font-style="italic">cập nhật hồ sơ</text><text x="600" y="650" font-family="Arial, Segoe UI, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#374151" font-style="italic">Vòng lặp: mỗi tín hiệu mới làm bài học tiếp theo khác đi. Cùng một chương, hai sinh viên nhận hai bài khác nhau.</text></svg>