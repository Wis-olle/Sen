# Render Blueprint — deploy demo Sen (Node + SQLite, phục vụ luôn ui-v2).
# Cách dùng: render.com → New → Blueprint → chọn repo Wis-olle/Sen, nhánh này → Apply.
# SQLite nằm trên đĩa tạm của dịch vụ: mỗi lần deploy lại là seed lại từ đầu (đúng ý cho demo).
# Khóa Gemini nhập tay trong Render (Environment) — sync: false nên không nằm trong repo.
services:
  - type: web
    name: sen-demo
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: TZ # planner và lịch dùng giờ máy chủ
        value: Asia/Ho_Chi_Minh
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SEED_PASSWORD
        value: demo1234
      - key: GEMINI_API_KEY
        sync: false
