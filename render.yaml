# Render Blueprint — deploy demo Sen (Node + SQLite, phục vụ luôn ui-v2).
# Cách dùng: render.com → New → Blueprint → chọn repo Wis-olle/Sen, nhánh này → Apply.
# SQLite nằm trên đĩa tạm của dịch vụ: mỗi lần deploy lại là seed lại từ đầu (đúng ý cho demo).
# DeepTutor (Python) không deploy kèm; phần sinh bài bằng AI sẽ báo "tạm nghỉ", bài seed vẫn đủ luồng demo.
services:
  - type: web
    name: sen-demo
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SEED_PASSWORD
        value: demo1234
      - key: DEEPTUTOR_URL
        value: http://127.0.0.1:8001
