<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trang chủ — Sen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="app.css" />
<style>
  /* ---- riêng Trang chủ ---- */
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:28px}
  .t-hot .art{display:flex;align-items:center;justify-content:space-evenly;padding:0 10px}
  .t-hot .art :is(img,svg.inl){height:64px;width:auto;opacity:.9}
  .t-hot .big{color:var(--ink);font-size:46px}
  .t-hot .big small{color:var(--ink-2);font-size:12px;margin-left:3px}
  .list .tile.p{background:var(--tint-peach)}.list .tile.a{background:var(--tint-amber)}.list .tile.s{background:var(--tint-sky)}.list .tile.m{background:var(--tint-mint)}
  @media (max-width:900px){.trio{grid-template-columns:1fr}}
  /* REVIEW-32 P1: ít môn (Bình 1 môn) → 2 thẻ bị ẩn nhưng lưới vẫn cứng 3 cột, thẻ đơn 249px lọt thỏm giữa 520px trắng.
     Chỉ đổi khi có thẻ ẩn nên bố cục 3 môn (đã duyệt 31 vòng) không suy suyển. */
  @media (min-width:901px){#courseGrid:has(.tcard[hidden]){grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
  /* REVIEW-32 P1 #6: hai khối chỉ đúng khi đã chẩn đoán → hidden sẵn, JS bật khi /api/courses xác nhận (trước đây vẽ ra rồi xoá ở t≈98ms, sụp 470px).
     .alert/.sec-h có display:flex, table có display:table nên riêng thuộc tính hidden không ẩn nổi. */
  #planBand[hidden],#weakHead[hidden],#weakTbl[hidden]{display:none}
  /* REVIEW-32 P2 #22: statusKind 'running' (đang trích xuất / dựng bản đồ) → pill có vòng xoay thay vì đứng im */
  .tcard .foot .pillmini .spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--cream-deep);border-top-color:var(--amber-deep);animation:spin 1s linear infinite;flex:none}
  .is-static .tcard .foot .pillmini .spin{animation:none}
  @media (max-width:700px){.list .mbar,.list th:nth-child(2),.list td:nth-child(2),.list th:nth-child(5),.list td:nth-child(5){display:none}.list .tile{width:38px;height:38px}}
</style>
</head>
<body data-page="dashboard" data-role="student" data-title="Trang chủ">
<div class="app">
  <aside class="sb" id="sb"></aside>
  <main class="main" id="main">
    <header class="tb" id="tb"></header>
    <div class="content">

      <div class="ph">
        <div><p class="eyebrow" id="today"></p>
        </div>
        <div class="ph-actions"><a class="btn btn-dark btn-sm" href="app-lesson.html">Học bài tiếp theo<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12 12 4M6 4h6v6"/></svg></a></div>
      </div>

      <div class="alert" id="planBand" role="status" hidden><svg class="ic" aria-hidden="true"><use href="#i-sparkles"/></svg><p></p><a class="link-arrow" href="app-plan.html">Xem lộ trình <svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></a></div>

      <div class="sec-h"><h2 id="secCourses">Hôm nay của <span class="pill" data-mark="underline">An</span></h2><a class="link-arrow" href="app-plan.html">Cả tuần <svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></a></div>
      <div class="trio" id="courseGrid">
        <a class="tcard t-amber" href="app-lesson.html" data-reveal>
          <div class="art"><img class="spot" src="assets/spot/learning.svg" alt="" width="500" height="500" /></div>
          <h3>Đang tải môn học…</h3><small>&nbsp;</small>
          <div class="foot"><span class="pillmini">&nbsp;</span><span class="go"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></span></div>
        </a>
        <a class="tcard t-mint" href="app-lesson.html#kiem-tra" data-reveal>
          <div class="art"><img class="spot" src="assets/spot/timer.svg" alt="" width="500" height="500" /></div>
          <h3>&nbsp;</h3><small>&nbsp;</small>
          <div class="foot"><span class="go"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></span></div>
        </a>
        <a class="tcard t-hot" href="app-plan.html" data-reveal>
          <div class="art"><img src="assets/ico/alarm.svg" alt="" width="64" height="64" /><span class="big"></span></div>
          <h3>&nbsp;</h3><small>&nbsp;</small>
          <div class="foot"><span class="pillmini">&nbsp;</span><span class="go"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></span></div>
        </a>
      </div>

      <div class="sec-h" id="weakHead" hidden><h2>Khái niệm còn yếu</h2><span class="tag tag--soft" id="weakCount"></span><a class="link-arrow" href="app-map.html" id="weakMap">Mở bản đồ <svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></a></div>
      <table class="list" id="weakTbl" data-reveal hidden>
        <thead><tr><th>Khái niệm</th><th>Cần trước</th><th>Mức</th><th>Bậc</th><th>Lịch</th><th></th></tr></thead>
        <tbody data-pop-row id="weakBody"></tbody>
      </table>
    </div>
  </main>

  <aside class="rail" aria-label="Hồ sơ và tiến độ">
    <h2>Hồ sơ<button class="ibtn" type="button" aria-label="Sửa hồ sơ" data-soon><svg class="ic" aria-hidden="true"><use href="#i-pencil"/></svg></button></h2>
    <div class="prof" data-reveal><span class="av"><img src="assets/doodles/sitting-reading-blue.svg" alt="" width="800" height="600" /></span><small>CNTT · K64 · mục tiêu: qua môn</small></div>
    <div data-reveal>
      <div class="cal-h"><span id="calTitle"></span><span><button class="ibtn" type="button" aria-label="Tháng trước" data-soon><svg class="ic" aria-hidden="true"><use href="#i-chevron-left"/></svg></button><button class="ibtn" type="button" aria-label="Tháng sau" data-soon><svg class="ic" aria-hidden="true"><use href="#i-chevron-right"/></svg></button></span></div>
      <div class="cal" role="img" id="cal" aria-label="Lịch tháng"></div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="api.js"></script>
<script src="icons.js"></script>
<script src="shell.js"></script>
<script src="motion.js"></script>
<script src="motion-assets.js"></script>
<script>
/* Bước 2 — chọn môn: GET /api/me + GET /api/courses đổ vào 3 thẻ .tcard (hợp đồng §3.3, §3.4).
   Nội dung cứng trong HTML là khung hiện ngay; API về thì ghi đè phần tử lá. */
(function () {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const ARROW = '<svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg>';
  const dmy = d => d ? d.split('-').reverse().slice(0, 2).join('/') : '';
  // .alert/.tcard/.sec-h có display:flex trong app.css → riêng thuộc tính hidden không đủ để ẩn
  const hide = el => { if (el) { el.hidden = true; el.style.display = 'none'; } };
  const show = el => { if (el) { el.hidden = false; el.style.display = ''; } };

  SEN.me.then(m => {
    const s = m && (m.student || m); if (!s || !s.fullName) return;
    const pill = $('#secCourses .pill');
    if (pill && pill.firstChild) pill.firstChild.textContent = s.fullName.trim().split(/\s+/).pop();
    const prof = $('.prof small');
    if (prof) prof.textContent = [s.major, s.cohort, s.goal && 'mục tiêu: ' + s.goal].filter(Boolean).join(' · ');
  });

  const grid = $('#courseGrid'), cards = $$('.tcard', grid);
  SEN_API.api('/api/courses').then(({ courses = [] }) => {
    const h2 = $('#secCourses'); if (h2 && h2.firstChild) h2.firstChild.textContent = 'Môn học của ';
    cards.forEach((card, i) => {
      const c = courses[i];
      if (!c) return hide(card);
      card.href = c.next && c.next.href || 'app-library.html';
      card.dataset.course = c.id;
      $('h3', card).textContent = c.name;
      $(':scope > small', card).textContent = [c.code, c.lecturer, c.examDate && 'thi ' + dmy(c.examDate)].filter(Boolean).join(' · ');
      // statusKind 'running' = việc nền đang chạy → vòng xoay, không để pill tĩnh kể chuyện đang chạy (REVIEW-32 P2 #22)
      $('.foot', card).innerHTML = `<span class="pillmini">${c.statusKind === 'running' ? '<span class="spin" aria-hidden="true"></span>' : ''}${SEN_API.esc(c.statusLabel || '')}</span><span class="go">${ARROW}</span>`;
      const art = $('.art', card), cur = $('[src]', art), big = $('.big', art);
      // thay cả .big: phần tử [data-count] cũ còn tween đếm của shell.js, gỡ khỏi DOM thì nó ghi vào chỗ không ai thấy
      if (big) big.innerHTML = c.daysToExam == null ? '' : `<span>${c.daysToExam}</span><small>ngày</small>`;
      if (cur && c.art && cur.getAttribute('src') !== c.art) { const im = new Image(); im.src = c.art; im.alt = ''; im.className = 'spot'; cur.replaceWith(im); }
    });
    if (!courses.length) {
      const c0 = cards[0]; c0.hidden = false; c0.style.display = ''; c0.href = 'app-library.html';
      $('h3', c0).textContent = 'Chưa có môn — tải tài liệu để bắt đầu';
      $('small', c0).textContent = 'Tải giáo trình lên, hệ thống dựng bản đồ khái niệm.';
      $('.foot', c0).innerHTML = `<span class="go">${ARROW}</span>`;
    }
    // băng kế hoạch: hidden sẵn trong HTML, chỉ bật khi có môn đã chẩn đoán, chữ lấy từ kế hoạch thật (REVIEW-32 P1 #6)
    const planned = courses.find(c => c.diagnosticDone && c.plan);
    if (planned) {
      const band = $('#planBand'), p = $('p', band);
      if (p) p.innerHTML = `<b>${SEN_API.esc(planned.name)} · kế hoạch tuần v${planned.plan.version}:</b> ${SEN_API.esc(planned.plan.reason)} · ${planned.plan.doneCount}/${planned.plan.itemCount} buổi đã xong.`;
      show(band);
    }
    // Khái niệm còn yếu + lịch tháng: môn đang học (đã chẩn đoán) → bản đồ (mức, tiên quyết) + kế hoạch (ngày học, ngày thi)
    const focus = planned || courses.find(c => c.diagnosticDone);
    if (focus) weak(focus);
    else cal([], null);
    if (window.SEN_MOTION) SEN_MOTION.rescan(grid);   // minh hoạ .spot vừa thay phải được nội tuyến để còn tự vẽ + thở (P2 #10)
  }).catch(e => SEN.toast(e.message, 'triangle-alert'));

  const now = new Date();
  const WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const p2 = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  $('#today').textContent = `${WD[now.getDay()]}, ${p2(now.getDate())}/${p2(now.getMonth() + 1)}/${now.getFullYear()}`;
  SEN.me.then(m => { if (m && m.term) $('#today').textContent += ' · Học kỳ ' + m.term; });

  /* lịch tháng hiện tại: t = hôm nay, p = ngày có buổi học, x = ngày thi; ô mờ = tháng bên cạnh */
  function cal(studyDates, examDate) {
    const y = now.getFullYear(), mo = now.getMonth(), first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7;
    const start = new Date(y, mo, 1 - lead), study = new Set(studyDates);
    let cells = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(h => `<span class="h">${h}</span>`).join('');
    const weeks = Math.ceil((lead + new Date(y, mo + 1, 0).getDate()) / 7);
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = iso(d);
      const cls = d.getMonth() !== mo ? 'o' : k === examDate ? 'x' : k === iso(now) ? 't' : study.has(k) ? 'p' : '';
      cells += `<span${cls ? ` class="${cls}"` : ''}>${d.getDate()}</span>`;
    }
    $('#cal').innerHTML = cells;
    $('#calTitle').textContent = `Tháng ${mo + 1}, ${y}`;
    const mine = [...study].filter(k => k.startsWith(`${y}-${p2(mo + 1)}`)).map(k => +k.slice(8));
    $('#cal').setAttribute('aria-label', `Lịch tháng ${mo + 1}: hôm nay ${now.getDate()}${mine.length ? ', các ngày có buổi học ' + mine.join(', ') : ''}${examDate && examDate.startsWith(`${y}-${p2(mo + 1)}`) ? ', ngày thi ' + +examDate.slice(8) : ''}`);
  }

  const TILES = [['p', 'nodes.svg'], ['a', 'arrow-wave.svg'], ['s', 'check-box.svg'], ['m', 'book.svg'], ['p', 'network.svg']];
  async function weak(course) {
    let map, plan;
    try { [map, plan] = await Promise.all([SEN_API.api(`/api/courses/${encodeURIComponent(course.id)}/map`), SEN_API.api(`/api/courses/${encodeURIComponent(course.id)}/plan`)]); }
    catch (e) { return; }
    cal(plan.items.filter(i => i.status !== 'done').map(i => i.date), plan.examDate);
    const byId = Object.fromEntries(map.concepts.map(c => [c.id, c]));
    const low = map.concepts.filter(c => c.score < 60).sort((a, b) => a.score - b.score).slice(0, 5);
    if (!low.length) return;
    const esc = SEN_API.esc;
    $('#weakCount').textContent = `${map.concepts.filter(c => c.score < 60).length}/${map.concepts.length} dưới 60`;
    $('#weakMap').href = 'app-map.html?course=' + encodeURIComponent(course.id);
    $('#weakBody').innerHTML = low.map((c, i) => {
      const [t, ico] = TILES[i % TILES.length];
      const item = plan.items.find(x => x.conceptId === c.id && x.status !== 'done');
      const pre = c.prereqs.map(id => byId[id] && byId[id].name).filter(Boolean).join(', ') || '—';
      return `<tr class="r"><td><span class="nm"><span class="tile ${t}"><img src="assets/ico/${ico}" alt="" /></span><span>${esc(c.name)}<small>${esc(c.note)}</small></span></span></td><td>${esc(pre)}</td><td><div class="mbar m-${c.level}"><i style="--p:${c.score}"></i></div></td><td><span class="lvl lvl-${c.level}">${esc(c.levelLabel)}</span></td><td class="n">${item ? dmy(item.date) : '—'}</td><td><a class="btn btn-ghost btn-xs" href="app-lesson.html?course=${encodeURIComponent(course.id)}&concept=${encodeURIComponent(c.id)}">Học</a></td></tr>`;
    }).join('');
    show($('#weakHead')); show($('#weakTbl'));
    if (window.SEN_MOTION) SEN_MOTION.rescan($('#weakTbl'));
  }

  // chuyển màn mang theo id môn: URL là nguồn sự thật, sessionStorage chỉ đỡ khi URL thiếu (hợp đồng §4.1)
  grid.addEventListener('click', e => {
    const a = e.target.closest('.tcard');
    if (a && a.dataset.course) try { sessionStorage.setItem('sen.courseId', a.dataset.course); } catch (_) {}
  });
})();
</script>
</body>
</html>
