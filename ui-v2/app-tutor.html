<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trợ giảng — Sen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="app.css" />
<style>
  /* ---- riêng Trợ giảng ---- */
  .chat{padding:0;display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:520px;overflow:hidden;background:var(--white);border:1px solid var(--line-2)}
  .msgs{flex:1;overflow:auto;padding:20px 22px 8px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
  .is-static .msgs{scroll-behavior:auto}
  .empty-chat{margin:auto;text-align:center;max-width:520px;padding:10px 0 20px}
  .empty-chat :is(img,svg.inl){width:170px;margin:0 auto 4px}
  .empty-chat h2{display:inline-block;font-size:20px;font-weight:800;letter-spacing:-.015em;margin-bottom:6px} /* inline-block: nét gạch chân vẽ tay ôm đúng chữ */
  .empty-chat p{font-size:14px;color:var(--muted);margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip-q{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--cream);font-size:13.5px;font-weight:600;text-align:left;transition:background .2s}
  .chip-q:hover{background:var(--cream-deep)}
  .chip-q .ic{width:14px;height:14px;color:var(--amber-deep)}
  .chip-q em{font-style:normal;background:var(--white);border-radius:6px;padding:0 5px}
  .msg{display:flex;gap:12px;max-width:88%}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg .av-ai{width:34px;height:34px;border-radius:50%;background:var(--amber);display:grid;place-items:center;flex:none;margin-top:2px}
  .msg .av-ai svg{width:20px;height:20px}
  .msg .body{display:grid;gap:8px;min-width:0}
  .bub{padding:12px 16px;border-radius:18px;font-size:15px;line-height:1.6}
  .me .bub{background:var(--ink);color:var(--white);border-bottom-right-radius:4px}
  .ai .bub{background:var(--cream);border-bottom-left-radius:4px;color:var(--ink-2)}
  .ai .bub b{color:var(--ink)}
  .ai .bub code{font-family:var(--num);font-weight:700;background:var(--white);border-radius:6px;padding:1px 5px;font-size:.92em;color:var(--ink)}
  .ai .bub p+p{margin-top:8px}
  .ai .bub .cite{margin:0 2px}
  .ai .bub .tbl{margin:10px 0 4px;font-size:13px}
  .tbl{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--white)}
  .tbl th{background:var(--cream-deep);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 10px}
  .tbl td{padding:7px 10px;border-top:1px solid var(--line-2);font-family:var(--num);font-weight:500}
  .tbl td.dup{background:#fff1d6}
  .msg time{font-size:11.5px;color:var(--muted);padding:0 6px}
  .me time{text-align:right}
  .bub.streaming::after{content:"";display:inline-block;width:2px;height:1em;background:var(--amber-deep);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .is-static .bub.streaming::after{animation:none}
  .typing{display:inline-flex;gap:5px;padding:14px 16px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--amber-deep);animation:bounce 1.2s ease-in-out infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
  .is-static .typing i{animation:none}
  .mem-strip{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:12px;background:var(--tint-amber);border-left:3px solid var(--amber-deep);font-size:13.5px;line-height:1.45}
  .mem-strip .ic{width:16px;height:16px;color:var(--amber-deep);flex:none;margin-top:2px}
  .mem-strip b{font-weight:700}
  .mem-strip.eff{background:var(--tint-mint);border-left-color:var(--ok)}.mem-strip.eff .ic{color:var(--ok)}
  .outside{padding:10px 14px;border-radius:12px;background:var(--white);border:1px dashed var(--line);font-size:13.5px;line-height:1.5;color:var(--ink-2)}
  .outside .lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn-ink);margin-right:6px}
  .outside .lbl .ic{width:13px;height:13px}
  .follow{display:flex;flex-wrap:wrap;gap:6px}
  .follow .chip-q{padding:7px 12px;font-size:13px}
  .composer{border-top:1px solid var(--line-2);padding:14px 18px;background:var(--white)}
  .composer form{display:flex;align-items:flex-end;gap:10px}
  .composer textarea{flex:1;resize:none;min-height:46px;max-height:140px;height:46px;padding:12px 14px;line-height:1.4}
  .composer .send{width:46px;height:46px;border-radius:50%;background:var(--amber);color:var(--ink);display:grid;place-items:center;flex:none;transition:background .2s}
  .composer .send:hover{background:var(--amber-deep)}
  .composer .send:disabled{background:var(--cream-deep);color:var(--muted);cursor:default}
  .composer .send .ic{width:18px;height:18px}
  .composer .hint{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
  .composer .hint span{display:inline-flex;align-items:center;gap:5px}
  .composer .hint .ic{width:13px;height:13px;color:var(--amber-deep)}
  /* rail */
  .ctxl{display:grid;gap:6px}
  .ctxl .row{padding:8px 8px;gap:10px;background:transparent;flex-wrap:nowrap}.ctxl .row>div:not(.end){flex:1 1 0}
  .ctxl .row .t{font-size:13.5px}
  .mem-mini{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid rgba(0,0,0,.06);font-size:13px;line-height:1.4}
  .mem-mini:first-of-type{border-top:0;padding-top:0}
  .mem-mini .ic{width:16px;height:16px;color:var(--amber-deep);flex:none;margin-top:2px}
  .mem-mini .kind{margin-left:0;margin-top:3px}
  .mem-mini .switch{margin-left:auto}
  .mem-mini .switch input{width:32px;height:18px;background:rgba(255,255,255,.8)}.mem-mini .switch input::after{width:12px;height:12px}.mem-mini .switch input:checked{background:var(--ink)}.mem-mini .switch input:checked::after{transform:translateX(14px)}
  .rail-fig{width:110px;margin:-6px auto -4px;display:block}
  @media (max-width:900px){.chat{height:auto;min-height:0}.msgs{max-height:60vh}.msg{max-width:100%}}
  @media (max-width:600px){.chips{flex-direction:column}.chip-q{width:100%;justify-content:flex-start;text-align:left}.empty-chat :is(img,svg.inl){width:140px}}
</style>
</head>
<body data-page="tutor" data-role="student" data-title="Trợ giảng">
<div class="app">
  <aside class="sb" id="sb"></aside>
  <main class="main" id="main">
    <header class="tb" id="tb"></header>
    <div class="content">
      <div class="ph">
        <div><p class="eyebrow" id="crumb">Trợ giảng</p></div>
        <div class="ph-actions"><button class="btn btn-white btn-sm" type="button" data-soon><svg class="ic" aria-hidden="true"><use href="#i-history"/></svg>Lịch sử</button><button class="btn btn-ghost btn-sm" type="button" id="btnClear"><svg class="ic" aria-hidden="true"><use href="#i-rotate-ccw"/></svg>Hội thoại mới</button></div>
      </div>

      <article class="card chat" data-reveal>
        <div class="msgs" id="msgs" aria-live="polite" aria-label="Hội thoại">
          <div class="empty-chat" id="empty">
            <img class="spot" src="assets/spot/talk.svg" alt="" width="500" height="500" data-float />
            <h2 data-mark="underline" id="askTitle">Hỏi gì về môn học?</h2>
            <div class="chips" id="chips"></div>
          </div>
        </div>
        <div class="composer">
          <form id="form">
            <textarea class="in" id="input" rows="1" placeholder="Đặt câu hỏi…" title="Enter gửi · Shift+Enter xuống dòng" aria-label="Câu hỏi"></textarea>
            <button class="send" type="submit" id="send" aria-label="Gửi" disabled><svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
          </form>
          <div class="hint"><span><svg class="ic" aria-hidden="true"><use href="#i-badge-check"/></svg><span id="hintScope">Bám tài liệu môn học</span></span><span><svg class="ic" aria-hidden="true"><use href="#i-quote"/></svg>Có trích dẫn từng ý</span><span><svg class="ic" aria-hidden="true"><use href="#i-brain"/></svg><span id="hintMem">Nhớ lỗi cũ của bạn</span></span></div>
        </div>
      </article>
    </div>
  </main>

  <aside class="rail" aria-label="Ngữ cảnh và trí nhớ">
    <div class="rh" data-reveal>
      <h2>Ngữ cảnh<span class="tag tag--soft">3–5 đoạn / câu</span></h2>
      <div class="ctxl" id="ctxl"></div>
    </div>
    <div class="card card--tint-amber" data-reveal>
      <img class="rail-fig spot" src="assets/spot/magic.svg" alt="" width="500" height="500" data-float />
      <div class="card-h" style="margin-bottom:8px"><h2><svg class="ic" aria-hidden="true"><use href="#i-brain"/></svg>Trí nhớ đang bật</h2><span class="tag tag--white" id="memCount">0</span></div>
      <div id="memList"></div>
      <p class="small muted" style="margin-top:8px">Tự tắt sau 3 lần đúng liên tiếp.</p>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js"></script>
<script src="icons.js"></script>
<script src="api.js"></script>
<script src="shell.js"></script>
<script src="motion.js"></script>
<script src="motion-assets.js"></script>
<script>
/* Trợ giảng: POST /api/courses/{id}/tutor → đoạn trả lời có trích dẫn (đoạn nguồn thật), ý ngoài tài liệu, trí nhớ đã dùng,
   2 câu hỏi tiếp. Lịch sử hội thoại giữ ở trình duyệt và gửi kèm. Câu trả lời hiện dần từng từ cho dễ đọc. */
(function () {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const rm = SEN.rm, msgs = $('#msgs'), empty = $('#empty'), input = $('#input'), send = $('#send');
  const Ap = SEN_API, esc = Ap.esc;
  const cite = c => `<button class="cite" type="button" data-src="${esc(c.code)}" data-page="${c.page}" data-q="${esc(c.snippet)}" data-doc="${esc(c.doc)}">[${esc(c.code)}] tr. ${c.page}</button>`;
  let course = null, history = [], useMat = null;
  const now = () => { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const lotus = '<svg viewBox="0 0 32 32" fill="none" stroke="#1d1d1d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 27c-6.5 0-10-4.2-10-9.5 0-3 1.4-5.4 3.2-7.3.6 2.4 1.9 4 3.6 4.9C12.5 11.6 14 8 16 5c2 3 3.5 6.6 3.2 10.1 1.7-.9 3-2.5 3.6-4.9C24.6 12.1 26 14.5 26 17.5 26 22.8 22.5 27 16 27Z" fill="#fff6e5"/><path d="M16 27V15"/></svg>';
  let busy = false;
  const scrollEnd = () => { msgs.scrollTop = msgs.scrollHeight; };
  const add = html => { const d = document.createElement('div'); d.innerHTML = html; const el = d.firstElementChild; msgs.appendChild(el); if (!rm) gsap.from(el, { opacity: 0, y: 6, duration: .25, ease: 'power2.out' }); scrollEnd(); return el; };
  async function ask(text) {
    if (busy || !course) return; busy = true; send.disabled = true;
    if (empty.parentNode) { if (rm) empty.remove(); else gsap.to(empty, { opacity: 0, y: -8, duration: .25, onComplete: () => empty.remove() }); }
    add(`<div class="msg me"><div class="body"><div class="bub">${esc(text)}</div><time>${now()}</time></div></div>`);
    const wrap = add(`<div class="msg ai"><span class="av-ai">${lotus}</span><div class="body"><div class="bub typing" aria-label="Đang soạn"><i></i><i></i><i></i></div></div></div>`);
    const body = $('.body', wrap);
    let ans;
    try { ans = await Ap.api('/api/courses/' + encodeURIComponent(course) + '/tutor', { method: 'POST', body: { message: text, history, materialIds: useMat } }); }
    catch (e) {
      $('.typing', body).remove();
      body.insertAdjacentHTML('beforeend', `<div class="bub">${esc(e.message)}</div><time>${now()}</time>`);
      busy = false; send.disabled = !input.value.trim(); scrollEnd(); return;
    }
    $('.typing', body).remove();
    const byCode = Object.fromEntries(ans.cites.map(c => [c.code, c]));
    const html = ans.paragraphs.map(p => `<p>${Ap.safe(p.html)}${p.cite && byCode[p.cite] ? cite(byCode[p.cite]) : ''}</p>`).join('');
    history.push({ role: 'user', text }, { role: 'model', text: ans.paragraphs.map(p => p.html.replace(/<[^>]+>/g, '')).join('\n') });
    if (ans.memory) {
      const eff = ans.memory.kind === 'effective_explanation';
      const m = document.createElement('div'); m.className = 'mem-strip' + (eff ? ' eff' : '');
      m.innerHTML = SEN.ic(eff ? 'lightbulb' : 'brain') + `<span><b>${eff ? 'Mình nhớ cách bạn hiểu nhanh:' : 'Nhớ bạn từng nhầm:'}</b> ${esc(ans.memory.text)}</span>`;
      body.appendChild(m); if (!rm) gsap.from(m, { x: -8, opacity: 0, duration: .3 });
    }
    const bub = document.createElement('div'); bub.className = 'bub streaming'; body.appendChild(bub);
    const toks = html.match(/<button[^>]*>[^<]*<\/button>|<[^>]+>|[^<\s]+\s*/g) || [html]; let acc = '', i = 0;
    const finish = () => {
      bub.innerHTML = html; bub.classList.remove('streaming');
      if (ans.outside) { const o = document.createElement('div'); o.className = 'outside'; o.innerHTML = `<span class="lbl">${SEN.ic('circle-alert')}Ngoài tài liệu môn học</span>${Ap.safe(ans.outside)}`; body.appendChild(o); if (!rm) gsap.from(o, { y: 6, opacity: 0, duration: .3 }); }
      if (ans.follow.length) {
        const fl = document.createElement('div'); fl.className = 'follow';
        fl.innerHTML = ans.follow.map(t => `<button class="chip-q" type="button" data-text="${esc(t)}">${SEN.ic('corner-down-right')}${esc(t)}</button>`).join('');
        body.appendChild(fl);
        if (!rm) gsap.from($$('.chip-q', fl), { scale: .85, opacity: 0, duration: .35, stagger: .06, ease: 'back.out(1.6)' });
      }
      const t = document.createElement('time'); t.textContent = `${now()} · ${ans.chunkCount} đoạn nguồn · ${(ans.ms / 1000).toFixed(1).replace('.', ',')} s`; body.appendChild(t);
      busy = false; send.disabled = !input.value.trim(); scrollEnd();
    };
    if (rm) return finish();
    const step = () => { if (i >= toks.length) return finish(); const n = Math.min(toks.length, i + 2); acc += toks.slice(i, n).join(''); i = n; bub.innerHTML = acc; scrollEnd(); setTimeout(step, 22); };
    step();
  }
  $('#form').addEventListener('submit', e => { e.preventDefault(); const v = input.value.trim(); if (!v || busy) return; input.value = ''; input.style.height = ''; send.disabled = true; ask(v); });
  input.addEventListener('input', () => { send.disabled = !input.value.trim() || busy; input.style.height = 'auto'; input.style.height = Math.min(140, input.scrollHeight) + 'px'; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); } });
  msgs.addEventListener('click', e => { const c = e.target.closest('.chip-q'); if (c) ask(c.dataset.text); });  $('#btnClear').addEventListener('click', () => { if (busy) return; $$('.msg', msgs).forEach(m => m.remove()); history = []; msgs.appendChild(empty); empty.style.opacity = ''; if (!rm) gsap.from(empty, { opacity: 0, y: 8, duration: .35 }); SEN.toast('Đã bắt đầu hội thoại mới', 'rotate-ccw'); });
  /* ngữ cảnh: môn, tài liệu (bật/tắt để giới hạn nguồn), trí nhớ (bật/tắt = PATCH /api/memories/{id}), câu gợi ý */
  const KIND = { misconception: ['nhầm lẫn', 'kind--mis', 'brain'], effective_explanation: ['cách hiểu tốt', 'kind--eff', 'lightbulb'], preference: ['sở thích', 'kind--eff', 'heart'] };
  async function boot() {
    course = await Ap.course();
    if (!course) return;
    let ctx;
    try { ctx = await Ap.api('/api/courses/' + encodeURIComponent(course) + '/tutor'); } catch (e) { return SEN.toast(e.message, 'triangle-alert'); }
    $('#crumb').textContent = ctx.courseName;
    $('#askTitle').textContent = `Hỏi gì về ${ctx.courseName}?`;
    input.placeholder = `Hỏi về ${ctx.courseName}…`;
    $('#hintScope').textContent = 'Bám tài liệu bạn đã tải';
    $('#chips').innerHTML = ctx.suggestions.map(t => `<button class="chip-q" type="button" data-text="${esc(t)}">${SEN.ic('sparkles')}${esc(t)}</button>`).join('');
    const mats = ctx.materials.filter(m => m.chunkCount);
    $('#ctxl').innerHTML = `<div class="row"><span class="tile" style="background:var(--tint-amber)"><img src="assets/ico/book.svg" alt="" /></span><div><div class="t">${esc(ctx.courseName)}</div><div class="s">${ctx.conceptCount} khái niệm</div></div></div>`
      + (mats.length ? mats.map(m => `<label class="row" style="cursor:pointer"><span class="tile" style="background:var(--tint-sky)"><img src="assets/ico/document.svg" alt="" /></span><div><div class="t">${esc(m.title)}</div><div class="s">${m.chunkCount} đoạn · đã lập chỉ mục</div></div><span class="end"><span class="switch"><input type="checkbox" checked data-mat="${esc(m.id)}" aria-label="Dùng tài liệu này" /></span></span></label>`).join('')
        : '<p class="small muted">Chưa có tài liệu. <a href="app-library.html">Tải tài liệu</a> để trợ giảng có nguồn mà bám.</p>');
    const on = ctx.memories.filter(m => m.active).length;
    const mis = ctx.memories.filter(m => m.active && m.kind === 'misconception').length;
    $('#hintMem').textContent = mis ? `Nhớ ${mis} lỗi cũ của bạn` : 'Nhớ cách bạn học';
    $('#memCount').textContent = on;
    $('#memList').innerHTML = ctx.memories.length ? ctx.memories.slice(0, 6).map(m => { const [lb, cls, ic] = KIND[m.kind] || KIND.preference;
      return `<div class="mem-mini">${SEN.ic(ic)}<div><b>${esc(m.text)}</b><br><span class="kind ${cls}">${lb}</span> <span class="muted small">${esc((m.evidence || '').replace(/^sai /, 'sai '))}</span></div><label class="switch"><input type="checkbox" ${m.active ? 'checked' : ''} data-mem="${esc(m.id)}" aria-label="Bật trí nhớ" /></label></div>`; }).join('')
      : '<p class="small muted">Chưa có. Làm bài chẩn đoán và câu kiểm tra để hệ thống nhớ chỗ bạn hay nhầm.</p>';
  }
  document.addEventListener('change', async e => {
    const mem = e.target.closest('[data-mem]'), mat = e.target.closest('[data-mat]');
    if (mat) { const ids = $$('[data-mat]').filter(x => x.checked).map(x => x.dataset.mat); useMat = ids.length === $$('[data-mat]').length ? null : ids; }
    if (mem) {
      try { await Ap.api('/api/memories/' + encodeURIComponent(mem.dataset.mem), { method: 'PATCH', body: { active: mem.checked } }); $('#memCount').textContent = $$('[data-mem]').filter(x => x.checked).length; }
      catch (err) { mem.checked = !mem.checked; SEN.toast(err.message, 'triangle-alert'); }
    }
  });
  boot().then(() => { const q = Ap.param('q'); if (q) setTimeout(() => ask(q), rm ? 0 : 600); });})();
</script>
</body>
</html>
